[versions]
minecraft = "1.16.5"
# Find yarn versions here: https://maven.fabricmc.net/net/fabricmc/yarn/
yarn_mappings = "1.16.5+build.9"
fabric_loader = "0.16.10"
loom = "1.10-SNAPSHOT"

# After changing versions, run:
# ./gradlew clean
# ./gradlew runClient --refresh-dependencies

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }
# If using 1.16.1 use tildejustin's mappings. Otherwise, use the default ones
# yarn_mappings = { module = "dev.tildejustin:yarn", version.ref = "yarn_mappings" }
yarn_mappings = { module = "net.fabricmc:yarn", version.ref = "yarn_mappings" }
fabric_loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric_loader" }

[plugins]
fabric_loom = { id = "fabric-loom", version.ref = "loom" }
